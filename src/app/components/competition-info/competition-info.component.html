<div class="competitionInfo d-flex flex-row flex-wrap">
    @for (group of groupsClassification; track group.groupName) {
            <div class="groupInfo d-flex flex-column m-3">
            <h2>{{group.groupName}}</h2>
            <table class="table">
                <thead>
                    <tr>
                        <th>Nombre del equipo</th>
                        <th>Victorias</th>
                        <th>Derrotas</th>
                        <th>+/-</th>
                        <th>Puntos</th>
                    </tr>
                </thead>
                <tbody>
                    @for (team of group.groupTeams; track team.id) {
                        <tr>
                            <td>{{team.name}}</td>
                            <td>{{team.wins}}</td>
                            <td>{{team.defeats}}</td>
                            <td>{{team.points_diff}}</td>
                            <td>{{team.classification_points}}</td>
                        </tr>
                    }
                </tbody>
            </table>
        </div>
        }
</div>
